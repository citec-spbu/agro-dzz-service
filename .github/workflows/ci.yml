name: CI

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio

      - name: Build smoke (compile sources)
        run: python -m compileall src

  tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio

      - name: Run tests
        env:
          PYTHONPATH: .
          APP_TITLE: dzz-service-test
          APP_VERSION: 0.0.0-test
        run: pytest -q

  deploy:
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ false }}

    steps:
      - name: Deploy placeholder
        run: echo "Deploy disabled. SSH access is not configured yet."
