services:
  db:
    image: postgres:15
    container_name: dzz-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5437:5432
    restart: always
    volumes:
      - dzz-pgdata:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 2s
      timeout: 10s
      retries: 10

  web:
    build: .
    container_name: dzz-service
    command: sh -c "uvicorn --factory src.main:create_app --host=0.0.0.0 --port=8080"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - 8005:8080
    restart: always

networks:
  default:
    name: agronetwork
    external: true

volumes:
  dzz-pgdata:
