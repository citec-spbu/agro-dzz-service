[tool.poetry]
name = "dzz-service"
version = "0.1.0"
description = "Remote sensing microservice for field analytics"
authors = ["Cursor Agent"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.3"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
httpx = "^0.27.0"
pydantic-settings = "^2.2.1"
psycopg = { extras = ["binary"], version = "^3.2.9" }
numpy = "^2.0.0"
pandas = "^2.2.2"
shapely = "^2.0.4"
pystac-client = "^0.8.2"
planetary-computer = "^1.0.0"
odc-stac = "^0.3.10"
xarray = "^2024.3.0"
rasterio = "^1.3.10"
dask = ">=2024.1,<2025.1"
pillow = "^11.2.1"
apscheduler = "^3.10.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
